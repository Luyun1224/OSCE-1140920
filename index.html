<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115年優良OSCE教案展播 - 台灣醫事聯合臨床技能發展學會</title>
    <!-- 引入 Tailwind CSS 框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts 的 Noto Sans TC 字體 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        /* --- 全域樣式 --- */
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
        }
        
        /* --- 影片播放器樣式 --- */
        .video-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 維持 16:9 的長寬比 */
        }
        
        .video-container #mainVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }
        
        /* --- 播放清單樣式 --- */
        .playlist-item {
            position: relative; /* 為了讓懸浮提示框正確定位 */
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .playlist-item:hover {
            transform: translateX(8px);
            background-color: #f0f9ff; /* 滑鼠懸浮時的淺藍色背景 */
        }
        
        /* 當前播放項目的樣式 */
        .playlist-item.active {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            transform: translateX(8px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }
        .playlist-item.active h4 {
            color: white; /* 作用中項目的文字變為白色 */
        }

        .playlist-hospital,
        .playlist-video-title {
            display: block;
        }

        .playlist-video-title {
            margin-top: 0.35rem;
        }

        .playlist-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.75rem;
        }

        .youtube-button {
            position: relative;
            z-index: 2;
        }

        .playlist-item.active .youtube-button {
            background-color: white;
            color: #0369a1;
        }

        /* --- 懸浮提示框 (Tooltip) 樣式 --- */
        .playlist-item .tooltip-text {
            visibility: hidden; /* 預設隱藏 */
            opacity: 0;
            width: 320px;
            background-color: #2d3748; /* 深灰藍背景 */
            color: #fff;
            text-align: left;
            border-radius: 8px;
            padding: 12px 16px;
            position: absolute;
            z-index: 10;
            bottom: 105%;
            left: 50%;
            transform: translateX(-50%);
            transition: opacity 0.3s ease, bottom 0.3s ease; /* 加入平滑動畫效果 */
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            pointer-events: none; /* 避免干擾滑鼠事件 */
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* 提示框的小箭頭 */
        .playlist-item .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #2d3748 transparent transparent transparent;
        }

        /* 滑鼠懸浮時顯示提示框 */
        .playlist-item:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
            bottom: 110%;
        }

        /* --- 其他元件樣式 --- */
        .auto-play-indicator {
            animation: pulse 2s infinite; /* 指示燈閃爍動畫 */
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .notice-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-left: 5px solid #ff6b6b;
        }

        /* 右下角固定警示標語樣式 */
        .fixed-warning {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 0.75rem 1.5rem; /* 調整大小以避免遮擋 */
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 2px solid #ef4444;
            z-index: 50; /* 確保在最上層 */
        }
        .fixed-warning-text {
            font-size: 2.25rem; /* 調整後的文字大小 */
            line-height: 1;
            font-weight: 700;
            color: #ef4444;
            animation: flashing-warning 1.5s infinite; /* 文字閃爍動畫 */
        }
        
        @keyframes flashing-warning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-cyan-50 min-h-screen">
    
    <div class="container mx-auto px-6 py-8">
        <!-- 頁首標題區 -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">
                🏆 台灣醫事聯合臨床技能發展學會 115年優良OSCE教案展播
            </h1>
        </header>

        <!-- 觀看注意事項區 -->
        <section class="notice-card rounded-2xl p-6 mb-8">
            <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                <span class="mr-2">⚠️</span>
                觀看注意事項
            </h3>
            <ul class="space-y-2 text-gray-700">
                <li class="flex items-start text-lg">
                    <span class="text-orange-500 mr-2">•</span>
                    影片將在播放完畢後自動輪播，您也可以隨時點選右側清單選擇特定教案。
                </li>
                <li class="flex items-start font-semibold text-red-600 text-lg">
                    <span class="text-red-500 mr-2">•</span>
                    所有展出影片之版權皆屬原作者及學會所有，嚴禁任何形式的錄製、轉載或散播影片連結。
                </li>
            </ul>
        </section>

        <!-- 主內容區 (影片與清單) -->
        <main class="flex flex-col lg:flex-row gap-8">
            <!-- 左側影片播放區 -->
            <div class="lg:w-2/3">
                <div class="bg-white rounded-2xl shadow-xl p-6">
                    <div class="mb-4 flex items-center justify-between">
                        <h2 id="currentTitle" class="text-2xl font-semibold text-gray-800">載入中...</h2>
                        <div id="autoPlayStatus" class="flex items-center space-x-2">
                            <span class="auto-play-indicator bg-red-500 w-3 h-3 rounded-full"></span>
                            <span class="text-sm text-gray-500">自動輪播已啟用</span>
                        </div>
                    </div>
                    
                    <div class="video-container mb-4 bg-gray-900 rounded-lg">
                        <div id="mainVideo"></div>
                    </div>

                    <div id="videoError" class="hidden mb-4 rounded-lg border border-red-200 bg-red-50 p-4 text-red-700" role="alert">
                        <p class="font-semibold">這部影片的 YouTube 設定不允許在外部網頁播放。</p>
                        <a id="youtubeLink" class="mt-3 inline-flex rounded-lg bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700" target="_blank" rel="noopener noreferrer">
                            在 YouTube 開啟這部影片 ↗︎
                        </a>
                    </div>
                    
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p id="currentDescription" class="text-gray-700">請從右側選擇影片開始觀看。</p>
                    </div>
                </div>
            </div>

            <!-- 右側教案清單 -->
            <aside class="lg:w-1/3">
                <div class="bg-white rounded-2xl shadow-xl p-6 sticky top-8">
                    <h3 class="text-xl font-semibold text-gray-800 mb-6 flex items-center">
                        <span class="mr-2">📋</span>
                        教案清單
                    </h3>
                    <div class="space-y-3" id="playlist">
                        <!-- 教案清單將由 JavaScript 動態生成 -->
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- 右下角固定警示標語 -->
    <div class="fixed-warning">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" viewBox="0 0 64 64">
            <g fill="none" stroke="#ef4444" stroke-width="5">
                <circle cx="32" cy="32" r="28"/>
                <line x1="12" y1="52" x2="52" y2="12"/>
            </g>
            <g fill="#111827">
                <rect x="17" y="26" width="18" height="14" rx="2" />
                <circle cx="26" cy="33" r="4" fill="white" />
                <rect x="32" y="22" width="12" height="20" rx="2" />
            </g>
        </svg>
        <span class="fixed-warning-text">嚴禁拍照、錄影</span>
    </div>

    <!-- 載入 YouTube Iframe Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- 1. 資料定義 ---
        const videos = [
            { id: 'CenAHkkUx90', title: '第03組 中山醫學大學附設醫院─失智症末期進食決策之跨領域全人照護', description: '本教案以失智症末期個案為情境，設計醫師、語言治療師與營養師跨領域全人照護OSCE。學員需整合各專業評估結果，並透過跨領域全人會議討論舒適進食與鼻胃管灌食之利弊，最終與家屬進行以病人為中心的共享決策與衛教。'},
            { id: 'S0-k3Ox41aM', title: '第04組 奇美醫療財團法人奇美醫院─檢驗異常驅動之跨專業即時通報與轉介：多發性骨髓瘤案例之OSCE教案設計', description: '醫檢師是醫療體系中，唯一能在檢驗分析前直接觀察檢體物理特徵的專業人員。當檢體出現異常凝固或分離膠未完全分離時，這並非單純的檢驗技術干擾，而是潛在m-protein發出的「關鍵預警」。透過本OSCE教案，我們旨在訓練學員將這些微小線索轉化為臨床行動力，從而縮短病人確診的延遲，實踐醫檢專業在早期癌症篩檢補位的關鍵守門人角色。設計從情境觸發到啟動通報流程，以SBAR結構化溝通與強化跨團隊醫病溝通示範。'},
            { id: 'NIOuEzKToKo', title: '第07組 新光醫療財團法人新光吳火獅紀念醫院─家長親職衛教與跨專業轉介－以6歲ADHD男童為例', description: '本教案落實「以家庭為中心」的理念，針對6歲ADHD男童的在校衝突，測驗考生臨床推理與溝通能力，目標包含提供情緒行為策略、緩解家長焦慮、處理跨代教養衝突，並展現轉介心理師的跨專業協作，實踐全人照護目標。'},
            { id: 'OMZ0y6hcT1Y', title: '第09組 高雄榮民總醫院─壓力性損傷評估照護', description: '訓練護理師與營養師對壓力性損傷的照護能力。透過臨床中風病患情境，護理師需執行傷口評估、無菌換藥與會診。營養師負責營養評估、管灌衛教及跨職類交班。旨在提升學員的臨床技能、醫病溝通與團隊合作素養。'},
            { id: 'zeFsfM09e8', title: '第12組 中山醫學大學附設醫院─科技輔助EPA導向跨領域全人照護教案－放射治療頭頸癌青少年之跨團隊全人照護', description: '本教案專為放射師與營養師設計，測驗全程由實際標準化病人（SP）參與演出，生動演繹面臨放療副作用與吞嚥困難的頭頸癌青少年，真實考驗考生的臨床應變與溝通溫度。本教案具備嚴謹的專家信效度，由跨領域的醫師、社工師及護理師共同進行專業評核與驗證。同時，測驗全面強化AI考官應用：在考生與真實SP互動時，AI考官會同步進行語音及語意分析，客觀紀錄放射師的安撫衛教與營養師的介入計畫。透過「AI精準數據追蹤」結合「跨領域專家回饋」，雙管齊下大幅提升EPA評估效能與全人照護實戰力。'}
        ];

        let currentVideoIndex = 0;
        let player;

        // --- 2. DOM 元素獲取 ---
        const playlistEl = document.getElementById('playlist');
        const currentTitleEl = document.getElementById('currentTitle');
        const currentDescriptionEl = document.getElementById('currentDescription');

        // --- 3. YouTube API 核心功能 ---

        /**
         * 當 YouTube API 腳本載入完成後，會自動呼叫此函數。
         */
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('mainVideo', {
                height: '360',
                width: '640',
                playerVars: {
                    'playsinline': 1,
                    'autoplay': 1,
                    'mute': 1, // 初始靜音以確保能自動播放
                    'controls': 1, // 顯示播放控制器
                    'rel': 0, // 播放結束後不顯示相關影片
                    'modestbranding': 1,
                    'iv_load_policy': 3 
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        /**
         * 當播放器準備好時觸發。
         */
        function onPlayerReady(event) {
            initPlaylist();
            playVideo(0); // 載入並播放第一部影片
            event.target.setVolume(100); // 將音量設為最大
        }

        /**
         * 當播放狀態改變時觸發 (例如：播放、暫停、結束)。
         */
        function onPlayerStateChange(event) {
            // 當影片開始播放時，設定畫質為最高
            if (event.data == YT.PlayerState.PLAYING) {
                event.target.setPlaybackQuality('highres');
            }
            // 當影片播放完畢時，自動播放下一部
            if (event.data == YT.PlayerState.ENDED) {
                nextVideo();
            }
        }

        /**
         * YouTube 拒絕嵌入或影片代碼有誤時，提供可正常開啟的原始網址。
         */
        function onPlayerError() {
            document.getElementById('videoError').classList.remove('hidden');
        }

        // --- 4. 頁面互動功能 ---

        /**
         * 根據影片資料，動態生成右側的播放清單。
         */
        function initPlaylist() {
            playlistEl.innerHTML = '';
            videos.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item p-4 rounded-lg border border-gray-200';
                
                const [hospital, ...titleParts] = video.title.split('─');
                const heading = document.createElement('h4');
                heading.className = 'font-medium text-gray-800';

                const hospitalLine = document.createElement('span');
                hospitalLine.className = 'playlist-hospital';
                hospitalLine.textContent = hospital;

                const titleLine = document.createElement('span');
                titleLine.className = 'playlist-video-title';
                titleLine.textContent = titleParts.join('─');

                const tooltip = document.createElement('p');
                tooltip.className = 'tooltip-text';
                tooltip.textContent = video.description;

                // YouTube 若禁止嵌入，播放器 API 無法繞過限制。每一筆都提供
                // 同步且可直接點擊的原始連結，不需等到非同步錯誤才能開啟。
                const actions = document.createElement('div');
                actions.className = 'playlist-actions';

                const youtubeButton = document.createElement('a');
                youtubeButton.className = 'youtube-button rounded-md bg-red-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-red-700';
                youtubeButton.href = getYouTubeUrl(video.id);
                youtubeButton.target = '_blank';
                youtubeButton.rel = 'noopener noreferrer';
                youtubeButton.textContent = 'YouTube 觀看 ↗︎';
                youtubeButton.setAttribute('aria-label', `在 YouTube 開啟：${video.title}`);
                youtubeButton.addEventListener('click', event => event.stopPropagation());

                actions.appendChild(youtubeButton);

                heading.append(hospitalLine, titleLine);
                item.append(heading, actions, tooltip);

                item.addEventListener('click', () => {
                    playVideo(index);
                });
                playlistEl.appendChild(item);
            });
        }

        /**
         * 播放指定索引的影片，並更新頁面資訊。
         * @param {number} index - 要播放的影片在 videos 陣列中的索引。
         */
        function playVideo(index) {
            if (index < 0 || index >= videos.length || !player) return;

            currentVideoIndex = index;
            const video = videos[index];

            const youtubeLink = document.getElementById('youtubeLink');
            document.getElementById('videoError').classList.add('hidden');
            youtubeLink.href = getYouTubeUrl(video.id);

            // 物件語法可確保每次切換都從頭載入；使用者點擊後明確要求播放，
            // 避免部分瀏覽器只更換影片但停留在未播放狀態。
            player.loadVideoById({ videoId: video.id, startSeconds: 0 });
            player.playVideo();
            
            // 更新影片標題和介紹
            currentTitleEl.textContent = video.title;
            currentDescriptionEl.textContent = video.description;
            
            // 更新清單中作用中項目的樣式
            document.querySelectorAll('.playlist-item').forEach((item, i) => {
                if (i === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        /**
         * 產生影片的 YouTube 原始網址。
         * @param {string} videoId - YouTube 影片 ID。
         * @returns {string} 可直接開啟的完整網址。
         */
        function getYouTubeUrl(videoId) {
            return `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
        }

        /**
         * 切換到下一部影片。
         */
        function nextVideo() {
            const nextIndex = (currentVideoIndex + 1) % videos.length;
            playVideo(nextIndex);
        }
    </script>
</body>
</html>
